[package]
name = "kermit"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.99"
clap = { version = "4", features = ["derive", "env"] }
regex = "1.11.2"
reqwest = { version = "0.12.23", features = ["json"] }
serde = {version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
strum = { version = "0.26.3", features = ["derive"] }
hex = "0.4.3"
secp256k1 = "0.30.0"
tokio = { version = "1.47.1", features = ["full"] }
serde_yaml = "0.9.34"
walkdir = "2.5.0"
once_cell = "1.21.3"
sha2 = "0.10.9"
blake2 = "0.10.6"
bs58 = "0.5.1"
i256 = "0.2.2"
futures = {version = "0.3.31", default-features = false }

[dev-dependencies]
insta = { version = "1", features = ["filters"] }
insta-cmd = "0.6.0"
serial_test = "3.2.0"
